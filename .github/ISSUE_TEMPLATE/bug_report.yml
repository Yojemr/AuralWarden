name: Informar un error
description: Comunica un comportamiento reproducible de AuralWarden.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Gracias por ayudar a mejorar AuralWarden. No adjuntes transcripciones privadas, enlaces firmados, cookies, credenciales, perfiles de voz ni grabaciones personales.

  - type: input
    id: version
    attributes:
      label: Versión de AuralWarden
      placeholder: "1.0.1"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Versión de Windows
      placeholder: "Windows 11 24H2, 64 bits"
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Fuente monitorizada
      options:
        - YouTube
        - Twitch
        - Kick
        - Radio o enlace directo
        - Archivo local
        - Audio general de Windows
        - Micrófono
        - No aplica
    validations:
      required: true

  - type: dropdown
    id: acceleration
    attributes:
      label: Motor o aceleración
      options:
        - CPU / faster-whisper
        - NVIDIA CUDA / faster-whisper
        - whisper.cpp CPU
        - whisper.cpp Vulkan
        - No lo sé
        - No aplica
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Modelo
      description: Indica Tiny, Base, Small, Large-v3-turbo o el modelo de whisper.cpp.
      placeholder: "Large-v3-turbo"

  - type: textarea
    id: description
    attributes:
      label: Descripción
      description: Explica qué ocurrió y qué estabas intentando hacer.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abrí...
        2. Configuré...
        3. Pulsé...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Resultado obtenido
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnóstico o capturas opcionales
      description: Elimina enlaces privados, nombres, rutas personales y contenido de las transcripciones antes de adjuntarlos.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidad
      options:
        - label: Confirmo que revisé los archivos y no contienen datos privados ni credenciales.
          required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Comprobaciones previas
      options:
        - label: Busqué incidencias abiertas o cerradas que describieran el mismo problema.
          required: true
        - label: Este informe no revela una vulnerabilidad de seguridad.
          required: true
