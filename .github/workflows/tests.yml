name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows · Python 3.12
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-build.lock.txt

      - name: Instalar dependencias públicas
        run: |
          python -m venv .ci-venv
          .\.ci-venv\Scripts\python.exe -m pip install -e ".[dev,desktop-cpu]" -c requirements-build.lock.txt

      - name: Comprobar dependencias
        run: .\.ci-venv\Scripts\python.exe -m pip check

      - name: Ejecutar pruebas
        run: .\.ci-venv\Scripts\python.exe -m pytest tests
